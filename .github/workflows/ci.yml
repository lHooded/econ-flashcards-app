name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - agent/initial-import

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical deck
        run: npm run validate:deck

      - name: Validate exam question bank
        run: npm run validate:exam-questions

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
