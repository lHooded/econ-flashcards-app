name: Deploy Sync Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck sync Worker
        run: npm run sync:typecheck

      - name: Test sync Worker
        run: npm run sync:test

      - name: Test sync Worker Durable Object runtime
        run: npm run sync:integration-test

      - name: Validate production sync configuration
        env:
          SYNC_APP_URL: ${{ vars.SYNC_APP_URL }}
          SYNC_API_URL: ${{ vars.SYNC_API_URL }}
        run: npm run validate:sync-deploy-config

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_APP_URL: ${{ vars.SYNC_APP_URL }}
        run: |
          if [ -z "$SYNC_APP_URL" ]; then
            echo "SYNC_APP_URL must be configured before deploying the sync Worker."
            exit 1
          fi
          npm run sync:deploy -- --var "SYNC_ALLOWED_ORIGIN:${SYNC_APP_URL}"
